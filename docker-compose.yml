version: "3.8"

services:
  jenkins:
    image: jenkinsci/jenkins:lts
    container_name: jenkins_container
    ports:
      - "8080:8080"
    volumes:
      - ./jenkins:/var/jenkins_home:rw
      - ./war:/mnt:rw

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: artifactory_container
    ports:
      - "9090:8081"
    volumes:
      - ./artifactory:/var/opt/jfrog/artifactory:rw

  sonarqube:
    image: sonarqube
    container_name: sonarqube_container
    ports:
      - "9000:9000"

  tomcat:
    image: tomcat
    container_name: tomcat_container
    depends_on:
      - jenkins
    ports:
      - "7777:8080"
    volumes:
      - ./war:/usr/local/tomcat/webapps:rw

  selenium-hub:
    image: selenium/hub
    container_name: selenium-hub
    ports:
      - "4444:4444"
    depends_on:
      - jenkins

  chrome:
    image: selenium/node-chrome-debug
    container_name: selenium-chrome
    depends_on:
      - selenium-hub
    environment:
      - HUB_PORT_4444_TCP_ADDR=selenium-hub
      - HUB_PORT_4444_TCP_PORT=4444
    ports:
      - "5901:5900"
    volumes:
      - /dev/shm:/dev/shm

  firefox:
    image: selenium/node-firefox-debug
    container_name: selenium-firefox
    depends_on:
      - selenium-hub
    environment:
      - HUB_PORT_4444_TCP_ADDR=selenium-hub
      - HUB_PORT_4444_TCP_PORT=4444
    ports:
      - "5900:5900"
    volumes:
      - /dev/shm:/dev/shm

  selenium-test:
    build:
      context: ./node
    container_name: selenium-test
    restart: always
    depends_on:
      - selenium-hub
    volumes:
      - ./test:/home/node/test:rw
      - ./report:/home/node/report:rw
    command: tail -f /dev/null
    stdin_open: true
    tty: true